version: '3.8'

services:
  go-service:
    build: ./services/go-service
    ports:
      - "8080:8080"
    environment:
      - GO_SERVICE_NAME=go-service
      - PORT=8080

  node-service:
    build: ./services/node-service
    ports:
      - "8081:8081"
    environment:
      - NODE_SERVICE_NAME=node-service
      - PORT=8081
